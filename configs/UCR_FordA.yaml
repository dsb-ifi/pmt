extends: base.yaml
data: {name: UCR_FordA}
loss:
  hgcl: {negatives: 128, window_weight: 1.0}
  hgcl_weight: 0.5
  icl_tau: 0.8
  pcl: {chunk: 256}
model: {layers: 8, pcl_projector: none, stride: 9}
optim: {gate_lr: 5.0, warmup: 0.05}
pma: {gate_residual: false, layers: 4}
probe: {early_reset: 0, full_scan: true, tasks: [linear], tune: none}
train:
  probe_epochs: [1, 6, 11, 16, 21, 26, 31, 36, 41, 46, 51, 56, 61, 66, 71, 76, 81, 86, 91, 96, 101, 106, 111, 116, 121, 126, 131, 136, 141, 146, 151, 156, 161, 166, 171, 176, 181, 186, 191, 196, 201, 206, 211, 216, 221, 226, 231, 236, 241, 246]
  probe_start: 1
  retain: false
