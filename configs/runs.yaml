# Expected dimensions for paper runs, checked against the loaded data.
data_shapes:
  UCR_FordA: {channels: 1, length: 500, classes: 2}
  UCR_FordB: {channels: 1, length: 500, classes: 2}
  UCR_ElectricDevices: {channels: 1, length: 96, classes: 7}
  HAR: {channels: 9, length: 128, classes: 6}
  UCR_PhalangesOutlinesCorrect: {channels: 1, length: 80, classes: 2}
  UCR_StarLightCurves: {channels: 1, length: 1024, classes: 3}
  electricity: {channels: 328, classes: 1}
  ETTh1: {channels: 14, classes: 1}
  epilepsy: {channels: 1, length: 178, classes: 2}
  UCR_Wafer: {channels: 1, length: 152, classes: 2}

# Applied in order, before an arm's own overrides.
presets:
  table2_cue:
    data.merge_val: null
    loss.hgcl.patch_tau: 0.03
    loss.hgcl.stride: 3
    loss.hgcl.window: 6
    loss.hgcl.window_tau: 0.04
    loss.hgcl.window_weight: 0.05
    loss.hgcl_weight: 1.0
    loss.icl_weight: 0.5
    loss.pcl.chunk: 512
    loss.pcl.tau: 0.8
    model.layers: 6
    model.neighbors: 4
    model.pcl_projector: per_state
    model.stem_norm: groupnorm
    optim.warmup: 0.0
    pma.skip_gate: tokenwise_legacy_constant_weight
    pma.stride: 11
    pma.window: 11
    probe.batch_size: 128
    probe.input_view: clean_base
    probe.static_batch: true
    probe.tasks: [linear, cue]
    train.probe_epochs: [250]
    train.probe_interval: 250
    train.probe_start: 250
    train.retain: true
  har_one_slot:
    data.magnitude_scale: 0.2
    loss.hgcl_weight: 0.25
    loss.icl_weight: 0.5
    loss.pcl_weight: 0.5
    train.epochs: 150
  tokenizer_sweep: {train.epochs: 150, train.probe_epochs: [1, 6, 11, 16, 21, 26, 31, 36, 41, 46, 51, 56, 61, 66, 71, 76, 81, 86, 91, 96, 101, 106, 111, 116, 121, 126, 131, 136, 141, 146]}
  table3_univariate: {data.channels: 8, data.univariate: true}

arms:
